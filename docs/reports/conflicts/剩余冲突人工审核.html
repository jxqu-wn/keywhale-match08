<script>
'use strict';
const report=JSON.parse(document.getElementById('report-data').textContent);
if(report.review_intro)document.getElementById('review-intro').textContent=report.review_intro;
if(report.classification_note)document.getElementById('classification-note').textContent=report.classification_note;
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const schemaMap=new Map(report.schemas.map(t=>[`${t.database}.${t.table}`,t]));
const fields=Object.entries(report.review_fields);
const storageKey='conflict-review-v1-'+JSON.stringify(report.input_sha256);
const reviews=Object.fromEntries(report.groups.map(g=>[g.group_id,{...g.review}]));
function cleanReview(review){
 const result={};for(const [key] of fields) result[key]=String(review?.[key]??'');
 if(!['待审核','已确认','需补充信息'].includes(result.status)) result.status='待审核';return result;
}
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved)for(const g of report.groups)if(saved[g.group_id])reviews[g.group_id]=cleanReview(saved[g.group_id]);}catch{}
const live=message=>{document.getElementById('live').textContent=message;};
function save(){try{localStorage.setItem(storageKey,JSON.stringify(reviews));}catch{live('浏览器无法保存填写内容，请导出审核文件。');}}
function updateStats(){
 const confirmed=report.groups.filter(g=>reviews[g.group_id].status==='已确认').length;
 const values=[['冲突组',report.summary.group_count],['原始标注',report.summary.record_count],['优先审核 P0',report.groups.filter(g=>g.priority==='P0').length],['已确认',confirmed]];
 document.getElementById('stats').innerHTML=values.map(([label,count])=>`<div class="stat"><strong>${count}</strong>${escapeHtml(label)}</div>`).join('');
}
document.getElementById('profiles').innerHTML='<table><thead><tr><th>实体</th><th>身份候选，需验证</th><th>需确认的业务逻辑</th></tr></thead><tbody>'+report.entity_profiles.map(p=>`<tr><td>${escapeHtml(p.title)}</td><td>${escapeHtml(p.candidate_key)}</td><td>${escapeHtml(p.notes)}</td></tr>`).join('')+'</tbody></table>';
const categorySelect=document.getElementById('category');
for(const [key,label] of new Map(report.groups.map(g=>[g.category,g.category_label]))){const option=document.createElement('option');option.value=key;option.textContent=label;categorySelect.appendChild(option);}
function visibleGroups(){
 const term=document.getElementById('search').value.trim().toLowerCase();
 return report.groups.filter(g=>{
  const category=categorySelect.value,priority=document.getElementById('priority').value,status=document.getElementById('status').value;
  const text=JSON.stringify([g.question,g.question_ids,g.tables,reviews[g.group_id]]).toLowerCase();
  return (!term||text.includes(term))&&(!category||g.category===category)&&(!priority||g.priority===priority)&&(!status||reviews[g.group_id].status===status);
 });
}
function queryStrings(annotation){return 'query' in annotation?[annotation.query]:[annotation.query1,annotation.query2];}
function selectField(key,label,value,options){return `<label>${escapeHtml(label)}<select data-field="${key}">${options.map(o=>`<option value="${escapeHtml(o)}"${o===value?' selected':''}>${escapeHtml(o||'请选择')}</option>`).join('')}</select></label>`;}
function textField(key,label,value){return `<label class="${key==='notes'?'full':''}">${escapeHtml(label)}<textarea data-field="${key}" rows="2">${escapeHtml(value)}</textarea></label>`;}
function renderGroup(g){
 const number=report.groups.indexOf(g)+1,review=reviews[g.group_id];
 const variants=g.variants.map(v=>`<section class="variant"><h3>候选 ${v.label}</h3><p class="muted">原始题号：${v.question_ids.join(', ')}<br>库表：${v.tables.map(escapeHtml).join('、')}</p>${queryStrings(v.annotation).map(q=>`<pre>${escapeHtml(q)}</pre>`).join('')}</section>`).join('');
 const schemas=g.schema_refs.map(name=>{const t=schemaMap.get(name);return `<details class="schema"><summary>${escapeHtml(name)} · ${escapeHtml(t.source)} · ${g.tables.includes(name)?'查询直接引用':'外键关联依赖'}</summary><p class="muted">来源：${escapeHtml(t.file)}</p><pre>${escapeHtml(t.ddl)}</pre></details>`;}).join('');
 const knowledge=g.knowledge.length?`<h3>相关专家知识（原文）</h3><ul>${g.knowledge.map(k=>`<li>知识 ${k.knowledge_id}：${escapeHtml(k.knowledge_text)}</li>`).join('')}</ul>`:'';
 const rule=g.existing_user_rules.length?`<div class="rules"><strong>已有用户口径</strong>${g.existing_user_rules.map(r=>`<p>${escapeHtml(r.instruction)}</p>`).join('')}<p class="muted">该口径来源于用户补充；跨年身份键仍需业务数据确认。</p></div>`:'';
 const handlingOptions=['','合并去重，2025优先','仅查询2025','仅查询2024','按问题明确年份','分别统计两年','保留历史事件，修订按身份覆盖','修正问题与标注不一致','等价标注统一','重定义过滤口径','自定义（见备注）'];
 if(review.handling&&!handlingOptions.includes(review.handling))handlingOptions.push(review.handling);
 const form=selectField('status','审核状态',review.status,['待审核','已确认','需补充信息'])+selectField('handling','处理方式',review.handling,handlingOptions)+fields.filter(([key])=>!['status','handling'].includes(key)).map(([key,label])=>textField(key,label,review[key])).join('');
 return `<details class="card group" data-group="${g.group_id}"><summary><span class="chevron">›</span><span class="badge ${g.priority.toLowerCase()}">${g.priority}</span><span class="summary-text"><strong>G${String(number).padStart(2,'0')} · ${escapeHtml(g.question)}</strong><small>${escapeHtml(g.category_label)} · 题号 ${g.question_ids.join(', ')}</small></span><span class="badge review-status ${review.status==='已确认'?'confirmed':''}">${escapeHtml(review.status)}</span></summary><div class="content"><h3>差异分析</h3><p>${escapeHtml(g.difference)}</p>${rule}<div class="two">${variants}</div><h3>人工需确认</h3><ul>${g.review_questions.map(q=>`<li>${escapeHtml(q)}</li>`).join('')}</ul>${knowledge}<details class="schema"><summary>查看库表字段、完整 DDL 和外键</summary>${schemas}</details><h3>填写人工决定</h3><div class="form-grid">${form}</div></div></details>`;
}
function render(){
 const visible=visibleGroups();document.getElementById('visible-count').textContent=`当前显示 ${visible.length} / ${report.groups.length} 组`;
 document.getElementById('groups').innerHTML=visible.map(renderGroup).join('')||'<p>当前筛选没有结果。</p>';
 updateStats();
}
for(const id of ['search','category','priority','status'])document.getElementById(id).addEventListener(id==='search'?'input':'change',render);
document.getElementById('groups').addEventListener('input',event=>{
 const field=event.target.dataset.field;if(!field)return;
 const card=event.target.closest('[data-group]');reviews[card.dataset.group][field]=event.target.value;save();updateStats();
 const badge=card.querySelector('.review-status');badge.textContent=reviews[card.dataset.group].status;badge.classList.toggle('confirmed',reviews[card.dataset.group].status==='已确认');
});
function download(name,text,type){
 const url=URL.createObjectURL(new Blob([text],{type}));const link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 live('已导出 '+name+'，包含全部'+report.groups.length+'组的当前填写内容。');
}
document.getElementById('export-json').addEventListener('click',()=>{
 const output={...report,manual_review_exported_at:new Date().toISOString(),groups:report.groups.map(g=>({...g,review:{...reviews[g.group_id]}}))};
 download('冲突人工审核结果.json',JSON.stringify(output,null,2)+'\n','application/json;charset=utf-8');
});
function csvCell(value){let text=String(value??'');if(/^[=+\-@]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';}
document.getElementById('export-csv').addEventListener('click',()=>{
 const rows=[['组编号','原始题号','问题','类别','差异分析',...fields.map(([,label])=>label)]];
 for(const g of report.groups)rows.push([g.group_id,g.question_ids.join(','),g.question,g.category_label,g.difference,...fields.map(([key])=>reviews[g.group_id][key])]);
 download('冲突人工审核结果.csv','\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n','text/csv;charset=utf-8');
});
document.getElementById('import-json').addEventListener('change',async event=>{
 const file=event.target.files[0];if(!file)return;
 try{
  const incoming=JSON.parse(await file.text());
  if(!incoming.input_sha256||Object.keys(incoming.input_sha256).length!==Object.keys(report.input_sha256).length||Object.entries(report.input_sha256).some(([key,value])=>incoming.input_sha256[key]!==value))throw new Error('输入数据指纹不同，请导入同一批报告导出的审核文件');
  if(!Array.isArray(incoming.groups)||incoming.groups.length!==report.groups.length)throw new Error('审核组数不完整');
  const ids=new Set(incoming.groups.map(g=>g.group_id));if(ids.size!==report.groups.length||report.groups.some(g=>!ids.has(g.group_id)))throw new Error('审核组编号不匹配');
  for(const g of incoming.groups)reviews[g.group_id]=cleanReview(g.review);save();render();live('已导入 '+file.name+' 的审核内容。');
 }catch(error){live('导入失败：'+error.message);}finally{event.target.value='';}
});
document.getElementById('expand').addEventListener('click',()=>document.querySelectorAll('.group').forEach(d=>d.open=true));
document.getElementById('collapse').addEventListener('click',()=>document.querySelectorAll('.group').forEach(d=>d.open=false));
render();
</script>
</body>
</html>
